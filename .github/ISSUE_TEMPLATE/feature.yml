name: Feature
description: Propose a scoped SecretTrace capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or security problem should this solve?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that define completion.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Describe data exposure, filesystem, output, or dependency risks.
